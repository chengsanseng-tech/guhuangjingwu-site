<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>古黄金屋｜阅读</title>
<style>
body{margin:0;background:#f7f2e8;color:#302820;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans SC","Microsoft YaHei",sans-serif;line-height:1.9}.wrap{max-width:900px;margin:auto;padding:24px 18px}.back{display:inline-block;margin-bottom:20px}.head{background:#fffdf8;border:1px solid #e1d7c8;border-radius:12px;padding:22px;margin-bottom:18px}.text{background:#fffdf8;border:1px solid #e1d7c8;border-radius:12px;padding:28px;white-space:pre-wrap;word-break:break-word}.meta{color:#766b5f;font-size:14px}.btn{display:inline-block;padding:7px 11px;border:1px solid #bda98e;border-radius:7px;text-decoration:none;margin-right:8px}
</style></head>
<body><main class="wrap"><a class="back" href="index.html#books">← 返回典籍目录</a><div id="head" class="head">正在加载……</div><article id="text" class="text">正在加载正文……</article></main>
<script>
const id=new URLSearchParams(location.search).get("book");
fetch("data/books.json").then(r=>r.json()).then(d=>{const b=(d.books||[]).find(x=>x.id===id);if(!b){document.getElementById("head").innerHTML="<h1>未找到该典籍</h1>";document.getElementById("text").textContent="请返回目录重新选择。";return}document.title="古黄金屋｜"+b.title;document.getElementById("head").innerHTML=`<h1>${b.title}</h1><div class="meta">${b.author||"作者待核"} · ${b.category} · ${b.type==="facsimile"?"影印本":"整理文本"}</div><p>${b.description||""}</p>${b.source?`<a class="btn" target="_blank" rel="noopener" href="${b.source}">打开来源</a>`:""}${b.text?`<a class="btn" target="_blank" rel="noopener" href="${b.text}">打开文本文件</a>`:""}`;if(b.text){fetch(b.text).then(r=>r.ok?r.text():Promise.reject()).then(t=>document.getElementById("text").textContent=t).catch(()=>document.getElementById("text").textContent="正文文件暂时无法加载，请使用上方文本文件入口。");}else document.getElementById("text").textContent="当前条目先作为目录与版本记录保留。待核验合法来源后，再补入全文或影印阅读入口。"}).catch(()=>document.getElementById("text").textContent="目录加载失败。");
</script></body></html>
